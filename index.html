<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#24180c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

        <path d="M54 94h12" stroke="currentColor" stroke-width="7" stroke-linecap="round" />

      <p>หมุนจอเป็นแนวนอนเพื่อเล่น<small>เกมนี้ออกแบบมาสำหรับจอแนวนอน</small></p>

      <canvas id="game" width="1600" height="800" aria-label="ฉากเกม Giraffe Escape"></canvas>
      <div id="overlay"></div>
      <button id="fullscreen" class="btn btn-quiet" type="button" aria-label="เต็มจอ" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
